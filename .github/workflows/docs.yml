# Org docs site — build strictly, publish to Cloudflare Workers Static Assets behind the
# docs router, and hand the search corpus to the documentation MCP.
#
# Provisioned by Caldrith from MagmaMoose/admin (files/workflows/docs.yml). Edit it
# THERE, not here; a local edit is reconciled away on the next run.
#
# ── WHY THIS IS A DIRECT ACTION CALL AND NO LONGER A REUSABLE WORKFLOW ──────
#
# It used to call `MagmaMoose/tremvok/.github/workflows/docs.yml`, pinned at v1.0.27,
# which deployed to Cloudflare Pages. The v2 line DELETED that file along with
# `target: cloudflare-pages`, so there is nothing left to call and a caller invokes the
# composite action itself. One job, where the reusable workflow had two.
#
# ADR-0005 (MagmaMoose/nievah, docs/adr/0005-docs-sites-and-mcp-surfaces.md) is why it had
# to move rather than sit on a maintained v1: index publishing exists ONLY on the
# `cloudflare-docs` target. Every repository in this list was contributing nothing to the
# fleet's documentation corpus — `mcp.magmamoose.com` answered every query with "0
# document(s) across 0 repository(ies)" — because the workflow that builds the docs had no
# way to express the step that publishes them. The step was never missing from the action;
# it was unreachable from here.
#
# ── THE THREE INPUTS THAT CARRY THE DESIGN ─────────────────────────────────
#
# `cloudflare-docs-host` — the site Worker has NO route and NO workers.dev URL. It is
# reachable only through the router's service binding on docs.magmamoose.com, which is what
# makes the Access application on that hostname a gate on the PERSON rather than something
# the router holds a token past. So the host is not this Worker's address; it is the address
# the Access check asks about, the address the run reports, and the address every citation
# in the corpus is built from.
#
# `cloudflare-docs-index-bucket` — the shared R2 corpus, written as `index/<repo>.json` by
# the build that has just rendered every page. EMPTY IS THE DEFAULT and empty publishes
# nothing, which is precisely the state the whole fleet was in for as long as nobody set it.
# Naming it here is the one line that turns a docs site into something an agent can read.
#
# `cloudflare-docs-require-access` — the private-docs gate, carried over unchanged from the
# Pages target. It makes the deploy ask Cloudflare which Access applications exist and
# REFUSE to publish when nothing covers the site. ADR-0005 names surviving this migration as
# a hard requirement, because it is enforcement rather than convention: a private repo whose
# gate quietly stopped being checked publishes proprietary internals and nothing says so.
# A repo with it on stays red until someone creates that application by hand in the
# Cloudflare dashboard — see `docs_require_access` in .github/settings.yml. That is the
# intended trade.
#
# ── ORDERING, WHICH IS THE ONE THING THAT BITES ────────────────────────────
#
# `.docs-site/wrangler.toml` is provisioned by the same settings.yml entry list and is what
# `--config` points at. It is IN the path filter below on purpose: these two files arrive in
# separate commits, so if only the workflow triggered a run, the reconcile that lands the
# workflow first would fail on a config that does not exist yet and nothing would re-run it.
# With both watched, whichever lands second re-runs the job against a complete pair.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.base.yml'
      - 'README.md'
      - '.markdownlint.jsonc'
      - '.docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.base.yml'
      - 'README.md'
      - '.markdownlint.jsonc'
      - '.docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# `contents: read` and no more. The action's sticky pull-request comment is the only thing
# here that would need `pull-requests: write`, and it is turned off below: nine repositories
# gaining a bot comment on every docs pull request is not what this change is for.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned, with the tag in the comment, like every other managed reference.
      # Caldrith's downgrade guard understands this shape and Dependabot bumps it.
      #
      # The v1 incident this file used to carry a paragraph about is worth keeping one
      # sentence of: `uses:` on a mutable major tag is how every repo in the fleet broke at
      # once when `v1` was retargeted onto a breaking line. The pin is the protection.
      - uses: MagmaMoose/tremvok@b3688ccea70926d4932fc2d9925a8c9ccc3a1717 # v2.10.0
        with:
          target: cloudflare-docs
          # The step above already checked out; a second one would be wasted work.
          checkout: 'false'
          # `auto`: a push to the default branch deploys, a pull request is a preview.
          # There is no preview DESTINATION for these Workers — no route, no workers.dev —
          # so a pull request builds strictly, lints, emits the corpus and publishes
          # neither the site nor the index. The build is the check.
          mode: auto
          # The site Worker's config: name, `[assets]`, and deliberately no route. Provisioned
          # beside this file, not written per repo.
          cloudflare-config: .docs-site/wrangler.toml
          cloudflare-docs-host: docs.magmamoose.com
          cloudflare-docs-index-bucket: magmamoose-docs-index
          cloudflare-docs-require-access: 'False'
          # Off, so `permissions:` above can stay at `contents: read`.
          pr-comment: 'false'
          # Org secrets, available to every repo in the org. The token is the "Edit
          # Cloudflare Workers" one, which carries Workers R2 Storage Edit — the permission
          # `wrangler r2 object put` needs to write the corpus.
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
