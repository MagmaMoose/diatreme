INHERIT: mkdocs.base.yml
# The fleet base (provisioned by Caldrith from MagmaMoose/admin) supplies site_url
# (https://docs.magmamoose.com/diatreme/), the theme, the accent and every markdown
# extension. Without this line MkDocs had no site_url: no canonical links and an
# empty sitemap.xml at docs.magmamoose.com/diatreme/. A repo must not declare
# markdown_extensions or plugins of its own, because MkDocs replaces lists instead
# of merging them; see the comment at the top of mkdocs.base.yml.
site_name: Diatreme
site_description: >-
  Release and deployment orchestration: a GitHub Marketplace composite action
  plus the hosted GitHub App broker that backs it.
repo_url: https://github.com/MagmaMoose/diatreme
repo_name: MagmaMoose/diatreme
docs_dir: docs

nav:
  - Home: index.md
  - Setup: setup.md
  - Using the action: action.md
  - Architecture: architecture.md
  - Broker: worker.md
  - How-to:
      - Releasing several packages: how-to/release-several-packages.md
      - Publishing a public Helm chart: how-to/publish-a-helm-chart.md
  - Reference:
      - Action: reference/action.md
      - Broker API: reference/broker-api.md
      - Broker configuration: reference/configuration.md
      - Errors: reference/errors.md
      - Limits: reference/limits.md
  - Operations:
      - Deployment: operations/deployment.md
  - Security: security.md
  - Glossary: glossary.md
  - Contributing: contributing.md
